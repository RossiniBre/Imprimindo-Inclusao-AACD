<section class="solicitacoes">
    <div class="conteudo">

        <!-- Resumo dos status -->
        <div class="resumo-cards">

            <button type="button" class="filtro card active"
                    data-status="todos">
                <span class="filtro-titulo">Total</span>
                <strong class="filtro-numero" id="total-recebidos">—</strong>
            </button>

            <button type="button" class="filtro card"
                    data-status="pendente">
                <span class="filtro-titulo">Pendentes</span>
                <strong class="filtro-numero pendente"
                        id="total-pendentes">—</strong>
            </button>

            <button type="button" class="filtro card"
                    data-status="aceita">
                <span class="filtro-titulo">Aceitos</span>
                <strong class="filtro-numero aceito"
                        id="total-aceitos">—</strong>
            </button>

            <button type="button" class="filtro card"
                    data-status="recusada">
                <span class="filtro-titulo">Recusados</span>
                <strong class="filtro-numero recusado"
                        id="total-recusados">—</strong>
            </button>

            <button type="button" class="filtro card"
                    data-status="falhou">
                <span class="filtro-titulo">Falhou</span>
                <strong class="filtro-numero falhou"
                        id="total-falhados">—</strong>
            </button>

        </div>

        <div id="lista-solicitacoes" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
        </div>

        <!-- Estado vazio -->
        <div id="estado-vazio" class="estado-vazio d-none">
            <div class="estado-icone">
                <i class="bi bi-inbox"></i>
            </div>

            <h3>Nenhuma solicitação encontrada</h3>

            <p>
                Quando houver solicitações disponíveis,
                elas serão exibidas aqui.
            </p>
        </div>

    </div>
</section>
