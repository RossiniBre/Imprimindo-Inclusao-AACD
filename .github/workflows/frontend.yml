name: Frontend CI

on:
  push:
    paths:
      - 'public/**'
      - 'tests/**'
      - 'package*.json'
      - '*.config.js'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'public/**'
      - 'tests/**'
      - 'package*.json'
      - '*.config.js'
      - '.github/workflows/frontend.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test